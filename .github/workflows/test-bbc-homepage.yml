name: Test BBC Homepage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - run: npx -y --min-release-age=0 --ignore-scripts=false @guidepup/setup@0.29.2 setup --ci --macos-record
        working-directory: ./bbc-homepage

      - run: |
          npm ci --no-audit --no-fund --no-progress
          npm rebuild ffmpeg-static --ignore-scripts=false
        working-directory: ./bbc-homepage

      - run: npx playwright install webkit
        working-directory: ./bbc-homepage

      - run: npx -y --min-release-age=0 --ignore-scripts=false @guidepup/setup@0.29.2 install
        working-directory: ./bbc-homepage

      - run: npm run test
        working-directory: ./bbc-homepage

      - uses: actions/upload-artifact@v7
        if: always()
        continue-on-error: true
        with:
          name: artifacts-${{ matrix.os }}
          path: |
            **/test-results/**/*
            **/recordings/**/*
